  <main class="content">
    <div class="report-container">
      <!-- Embed the uploaded raw Capstone HTML to preserve exact Word-export formatting and images -->

      <div class="frame-wrap">
        <iframe id="report-frame" src="Capstone HTML.html" title="Capstone report: Rate My Professor Data Analysis" loading="lazy"></iframe>
      </div>

      <script>
        // Resize the iframe to match the embedded document height (same-origin)
        // and remove the inner scrollbar so only the page scrolls.
        (function(){
          const iframe = document.getElementById('report-frame');
          iframe.setAttribute('scrolling', 'no');
          iframe.style.overflow = 'visible';

          function resizeIframe(){
            try {
              const doc = iframe.contentDocument || iframe.contentWindow.document;
              if (!doc) return;
              const body = doc.body, html = doc.documentElement;
              // try to remove inner scrollbars
              body.style.overflow = 'visible';
              html.style.overflow = 'visible';
              // compute full height of embedded content
              const height = Math.max(
                body.scrollHeight, body.offsetHeight,
                html.clientHeight, html.scrollHeight, html.offsetHeight
              );
              // add a tiny buffer to avoid rounding clipping
              iframe.style.height = (height + 6) + 'px';
            } catch (e) {
              // If anything fails (cross-origin), fallback to viewport-based height
              iframe.style.height = 'calc(100vh - 220px)';
            }
          }

          iframe.addEventListener('load', function(){
            // Resize after load and again shortly after to allow images/fonts to settle
            resizeIframe();
            setTimeout(resizeIframe, 200);
            setTimeout(resizeIframe, 800);
          });

          // On window resize, recalc
          window.addEventListener('resize', resizeIframe);
        })();
      </script>
    </div>
  </main>
