      <div class="frame-wrap">
        <iframe id="report-frame" src="Capstone HTML.html" title="Capstone report: Rate My Professor Data Analysis" loading="lazy"></iframe>
      </div>

      <script>
        // Resize the iframe to match the embedded document height (same-origin)
        // or allow normal viewing if cross-origin restricts full size wrapping
        (function(){
          const iframe = document.getElementById('report-frame');

          function resizeIframe(){
            try {
              const doc = iframe.contentDocument || iframe.contentWindow.document;
              if (!doc) throw new Error("No doc access");
              const body = doc.body, html = doc.documentElement;
              // If we have doc access, remove internal scrolling and let iframe expand
              body.style.overflow = 'hidden';
              html.style.overflow = 'hidden';
              iframe.setAttribute('scrolling', 'no');
              iframe.style.overflow = 'hidden';
              
              const height = Math.max(
                body.scrollHeight, body.offsetHeight,
                html.clientHeight, html.scrollHeight, html.offsetHeight
              );
              iframe.style.height = (height + 20) + 'px';
            } catch (e) {
              // If local viewing (file://) blocks doc access, fallback to scrollable viewport
              iframe.setAttribute('scrolling', 'yes');
              iframe.style.overflow = 'auto';
              iframe.style.height = 'calc(100vh - 120px)';
            }
          }

          iframe.addEventListener('load', function(){
            // Resize after load and again shortly after to allow images/fonts to settle
            resizeIframe();
            setTimeout(resizeIframe, 200);
            setTimeout(resizeIframe, 800);
          });

          // On window resize, recalc
          window.addEventListener('resize', resizeIframe);
        })();
      </script>
    </div>
