<!-- Visitor counter using CountAPI (no server required). Counts once per visitor per 24 hours using localStorage throttle. -->
<script>
  (function(){
    // Session-only counting: increment once per browser session (cleared on tab close)
    const NAMESPACE = 'kaiser-portfolio';
    const KEY = 'homepage';
    const HIT_URL = `https://api.countapi.xyz/hit/${NAMESPACE}/${KEY}`;
    const GET_URL = `https://api.countapi.xyz/get/${NAMESPACE}/${KEY}`;
    const SESSION_FLAG = 'kaiser_counter_session_hit';
    const el = document.getElementById('visitor-count');
    if (!el) return;

    const didHitThisSession = sessionStorage.getItem(SESSION_FLAG) === '1';
    const url = didHitThisSession ? GET_URL : HIT_URL;

    fetch(url)
      .then(res => res.json())
      .then(data => {
        if (data && typeof data.value !== 'undefined') {
          el.textContent = data.value;
          if (!didHitThisSession) sessionStorage.setItem(SESSION_FLAG, '1');
        } else {
          el.textContent = '—';
        }
      })
      .catch(err => {
        console.error('Visitor counter error:', err);
        el.textContent = '—';
      });
  })();
</script>
