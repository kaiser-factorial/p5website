        <script>
            // ── Bezier ring — vanilla JS canvas (no p5, no global event conflicts) ──
            (function () {
                const canvas = document.getElementById('bezier-bg');
                const ctx = canvas.getContext('2d');
                const N = 60;   // modulus
                let t = 0;    // time
                let CX, CY, RAD;

                function resize() {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    CX = canvas.width * 0.76;   // centre of right panel, away from divider
                    CY = canvas.height * 0.50;
                    RAD = Math.min(canvas.width * 0.30, canvas.height * 0.40);
                }
                window.addEventListener('resize', resize);
                resize();

                function lerpAng(a1, a2, frac) {
                    let d = a2 - a1;
                    if (d > Math.PI) d -= 2 * Math.PI;
                    if (d < -Math.PI) d += 2 * Math.PI;
                    return a1 + d * frac;
                }

                function hslStr(h, s, l, a) {
                    return 'hsla(' + (h % 360).toFixed(1) + ',' + s + '%,' + l + '%,' + a + ')';
                }

                function bezierFrame() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    t += 0.004;
                    const mult = 2 + 1.5 * Math.sin(t);

                    for (let k = 0; k < N; k++) {
                        const target = (mult * k) % N;
                        const a1 = -Math.PI / 2 + (2 * Math.PI) * (k / N);
                        const a2 = -Math.PI / 2 + (2 * Math.PI) * (target / N);

                        const x1 = CX + RAD * Math.cos(a1), y1 = CY + RAD * Math.sin(a1);
                        const x2 = CX + RAD * Math.cos(a2), y2 = CY + RAD * Math.sin(a2);

                        const cr = RAD * 0.5;
                        const ma1 = lerpAng(a1, a2, 0.3);
                        const ma2 = lerpAng(a1, a2, 0.7);
                        const cx1 = CX + cr * Math.cos(ma1), cy1 = CY + cr * Math.sin(ma1);
                        const cx2 = CX + cr * Math.cos(ma2), cy2 = CY + cr * Math.sin(ma2);

                        const hue = 45 + 13 * Math.sin(k * 0.42 + t * 0.6); // 32–58: amber→yellow
                        const sat = 85 + 12 * Math.sin(k * 0.3);             // 73–97%
                        const lit = 58 + 18 * Math.sin(k * 0.25 + t * 0.4); // 40–76%
                        ctx.strokeStyle = hslStr(hue, sat, lit, 0.5);
                        ctx.lineWidth = 1.2;
                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.bezierCurveTo(cx1, cy1, cx2, cy2, x2, y2);
                        ctx.stroke();
                    }
                    requestAnimationFrame(bezierFrame);
                }
                bezierFrame();
            })();
        </script>

        <script>
            (function () {
                /* ── Ising model background ── */
                const canvas = document.getElementById('ising-bg');
                const ctx = canvas.getContext('2d');

                // Spin colours matching the standalone page
                const UP_COLOR = '#4195DE';
                const DN_COLOR = '#D23B72';

                let N = 60;            // grid cells
                let spin = [];
                let sweepCount = 0;
                let animId = null;

                // ── Resize canvas to fill the viewport ──────────────────────────────────
                function resize() {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                }
                window.addEventListener('resize', resize);
                resize();

                // ── Init grid (random) ───────────────────────────────────────────────────
                function makeGrid() {
                    spin = [];
                    for (let i = 0; i < N; i++) {
                        spin[i] = new Int8Array(N);
                        for (let j = 0; j < N; j++) {
                            spin[i][j] = Math.random() < 0.5 ? 1 : -1;
                        }
                    }
                    sweepCount = 0;
                }

                // ── Metropolis sweep ─────────────────────────────────────────────────────
                function sweep(T) {
                    const beta = 1 / T;
                    const cache = {};
                    for (let k = 0; k < N * N; k++) {
                        const i = (Math.random() * N) | 0;
                        const j = (Math.random() * N) | 0;
                        const s = spin[i][j];
                        const nb = spin[(i - 1 + N) % N][j] + spin[(i + 1) % N][j]
                            + spin[i][(j - 1 + N) % N] + spin[i][(j + 1) % N];
                        const dE = 2 * s * nb;
                        if (dE <= 0) {
                            spin[i][j] = -s;
                        } else {
                            if (cache[dE] === undefined) cache[dE] = Math.exp(-beta * dE);
                            if (Math.random() < cache[dE]) spin[i][j] = -s;
                        }
                    }
                }

                // ── Draw ─────────────────────────────────────────────────────────────────
                function isingDraw() {
                    const W = canvas.width;
                    const H = canvas.height;
                    const cw = W / N;
                    const ch = H / N;
                    for (let i = 0; i < N; i++) {
                        for (let j = 0; j < N; j++) {
                            ctx.fillStyle = spin[i][j] === 1 ? UP_COLOR : DN_COLOR;
                            ctx.fillRect(j * cw, i * ch, cw + 0.5, ch + 0.5); // +0.5 avoids hairlines
                        }
                    }
                }

                // ── Animation loop ───────────────────────────────────────────────────
                // 1 sweep per frame ≈ 60 physics steps/sec at 60 fps
                function isingLoop() {
                    const T = parseFloat(document.getElementById('ising-temp-home').value);
                    sweep(T);
                    sweepCount++;
                    isingDraw();
                    animId = requestAnimationFrame(isingLoop);
                }

                // ── Controls ─────────────────────────────────────────────────────────────
                const slider = document.getElementById('ising-temp-home');
                const tempVal = document.getElementById('ising-temp-val');
                const resetBtn = document.getElementById('ising-reset-home');

                slider.addEventListener('input', function () {
                    tempVal.textContent = parseFloat(this.value).toFixed(1);
                });

                resetBtn.addEventListener('click', function () {
                    makeGrid();
                });

                // ── Kick off ─────────────────────────────────────────────────────────────
                makeGrid();
                isingLoop();
            })();
        </script>
