    </div>

    <script>
        (() => {
            const canvas = document.getElementById('bezier-bg');
            const context = canvas.getContext('2d');
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            let time = 0;
            let centerX, centerY, radius;

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                centerX = canvas.width * 0.78;
                centerY = canvas.height * 0.5;
                radius = Math.min(canvas.width * 0.28, canvas.height * 0.38);
            }
            function interpolateAngle(a, b, fraction) {
                let difference = b - a;
                if (difference > Math.PI) difference -= Math.PI * 2;
                if (difference < -Math.PI) difference += Math.PI * 2;
                return a + difference * fraction;
            }
            function draw() {
                context.clearRect(0, 0, canvas.width, canvas.height);
                time += reduceMotion ? 0 : 0.004;
                const multiplier = 2 + 1.5 * Math.sin(time);
                for (let index = 0; index < 60; index += 1) {
                    const target = (multiplier * index) % 60;
                    const angleA = -Math.PI / 2 + (Math.PI * 2 * index / 60);
                    const angleB = -Math.PI / 2 + (Math.PI * 2 * target / 60);
                    const startX = centerX + radius * Math.cos(angleA);
                    const startY = centerY + radius * Math.sin(angleA);
                    const endX = centerX + radius * Math.cos(angleB);
                    const endY = centerY + radius * Math.sin(angleB);
                    const controlRadius = radius * .5;
                    const controlA = interpolateAngle(angleA, angleB, .3);
                    const controlB = interpolateAngle(angleA, angleB, .7);
                    context.strokeStyle = `hsla(${45 + 13 * Math.sin(index * .42 + time * .6)}, 92%, 66%, .52)`;
                    context.lineWidth = 1.2;
                    context.beginPath();
                    context.moveTo(startX, startY);
                    context.bezierCurveTo(
                        centerX + controlRadius * Math.cos(controlA), centerY + controlRadius * Math.sin(controlA),
                        centerX + controlRadius * Math.cos(controlB), centerY + controlRadius * Math.sin(controlB),
                        endX, endY
                    );
                    context.stroke();
                }
                if (!reduceMotion) requestAnimationFrame(draw);
            }
            window.addEventListener('resize', () => { resize(); draw(); });
            resize();
            draw();
        })();
    </script>
    <script>
        (() => {
            const canvas = document.getElementById('ising-bg');
            const context = canvas.getContext('2d');
            const temperature = document.getElementById('ising-temp-home');
            const temperatureLabel = document.getElementById('ising-temp-val');
            const resetButton = document.getElementById('ising-reset-home');
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const cells = 60;
            let spins = [];

            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; draw(); }
            function makeGrid() {
                spins = Array.from({ length: cells }, () => Int8Array.from({ length: cells }, () => Math.random() < .5 ? 1 : -1));
            }
            function sweep(value) {
                const beta = 1 / value;
                for (let count = 0; count < cells * cells; count += 1) {
                    const row = (Math.random() * cells) | 0;
                    const column = (Math.random() * cells) | 0;
                    const spin = spins[row][column];
                    const neighbors = spins[(row - 1 + cells) % cells][column] + spins[(row + 1) % cells][column] + spins[row][(column - 1 + cells) % cells] + spins[row][(column + 1) % cells];
                    const delta = 2 * spin * neighbors;
                    if (delta <= 0 || Math.random() < Math.exp(-beta * delta)) spins[row][column] = -spin;
                }
            }
            function draw() {
                const width = canvas.width / cells;
                const height = canvas.height / cells;
                for (let row = 0; row < cells; row += 1) {
                    for (let column = 0; column < cells; column += 1) {
                        context.fillStyle = spins[row]?.[column] === 1 ? '#4195de' : '#d23b72';
                        context.fillRect(column * width, row * height, width + .5, height + .5);
                    }
                }
            }
            function loop() { sweep(Number(temperature.value)); draw(); requestAnimationFrame(loop); }
            temperature.addEventListener('input', () => { temperatureLabel.textContent = Number(temperature.value).toFixed(1); if (reduceMotion) { sweep(Number(temperature.value)); draw(); } });
            resetButton.addEventListener('click', () => { makeGrid(); draw(); });
            window.addEventListener('resize', resize);
            makeGrid();
            draw();
            if (!reduceMotion) loop();
        })();
    </script>
    <script src="global_transition.js"></script>
