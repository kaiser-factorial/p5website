<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name Animations Sandbox</title>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #fcfcfc;
            color: #FFD600;
            font-family: 'Russo One', sans-serif;
            text-transform: uppercase;
            text-align: center;
            overflow-x: hidden;
            padding: 50px 0;
            display: flex;
            flex-direction: column;
            gap: 15vh; /* Plenty of space to isolate effects for testing */
        }
        h2 { color: #888; font-family: sans-serif; font-size: 1.2rem; margin-bottom: 30px; text-transform: none; }
        
        .name-container {
            font-size: 5rem;
            cursor: pointer;
            user-select: none;
            text-shadow: 2px 4px 16px rgba(0,0,0,0.35);
            display: inline-block;
        }

        /* -------------------------------------
           2. SINE WAVE RIPPLE
           ------------------------------------- */
        .sine-wave span {
            display: inline-block;
            transition: transform 0.3s ease;
        }
        .sine-wave:hover span {
            animation: sineBounce 0.9s infinite ease-in-out alternate;
        }
        @keyframes sineBounce {
            0% { transform: translateY(0); color: #FFD600; text-shadow: 2px 4px 16px rgba(0,0,0,0.35); }
            100% { transform: translateY(-25px) scale(1.1); color: #4195DE; text-shadow: 2px 24px 24px rgba(0,0,0,0.25); }
        }

        /* -------------------------------------
           3. MAGNETIC REPULSION 
           ------------------------------------- */
        #magnetic span {
            display: inline-block;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.4s ease;
        }

        /* -------------------------------------
           4. 3D ISOMETRIC LIFT
           ------------------------------------- */
        .iso-lift {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), text-shadow 0.4s ease, color 0.4s ease;
            transform-style: preserve-3d;
        }
        .iso-lift:hover {
            transform: perspective(800px) rotateX(25deg) rotateY(-20deg) translateZ(40px) scale(1.1);
            text-shadow: 15px 30px 40px rgba(0,0,0,0.4), -3px -3px 0px #4195DE;
            color: white;
        }

        /* -------------------------------------
           5. GLITCH WAVEFORM
           ------------------------------------- */
        .glitch-wave {
            position: relative;
        }
        .glitch-wave:hover::before, .glitch-wave:hover::after {
            content: "CORINA KAISER";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }
        .glitch-wave:hover::before {
            color: #4195DE;
            z-index: -1;
            animation: glitchAnimation 0.3s infinite;
        }
        .glitch-wave:hover::after {
            color: #D23B72;
            z-index: -2;
            animation: glitchAnimation 0.4s infinite reverse;
        }
        @keyframes glitchAnimation {
            0% { transform: translate(0, 0); clip-path: inset(10% 0 80% 0); }
            20% { transform: translate(-8px, 4px); clip-path: inset(40% 0 10% 0); }
            40% { transform: translate(8px, -4px); clip-path: inset(80% 0 5% 0); }
            60% { transform: translate(-4px, 8px); clip-path: inset(5% 0 60% 0); }
            80% { transform: translate(4px, -8px); clip-path: inset(20% 0 20% 0); }
            100% { transform: translate(0, 0); clip-path: inset(50% 0 30% 0); }
        }

    </style>
</head>
<body>

    <div>
        <h2>1. The Matrix/Cipher Scramble</h2>
        <div class="name-container" id="cipher">CORINA KAISER</div>
    </div>

    <div>
        <h2>2. The Sine Wave Ripple</h2>
        <div class="name-container sine-wave" id="sine"></div>
    </div>

    <div>
        <h2>3. Magnetic Particle Repulsion (Hover closely over individual letters)</h2>
        <div class="name-container" id="magnetic"></div>
    </div>

    <div>
        <h2>4. The 3D Isometric Lift</h2>
        <div class="name-container iso-lift" id="iso">CORINA KAISER</div>
    </div>

    <div>
        <h2>5. The Glitching Waveform</h2>
        <div class="name-container glitch-wave" id="glitch">CORINA KAISER</div>
        <br><br><br><br> <!-- Bottom padding -->
    </div>

    <script>
        // -------------------------------------
        // 1. CIPHER SCRAMBLE LOGIC
        // -------------------------------------
        const cipherEl = document.getElementById('cipher');
        const originalText = "CORINA KAISER";
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ∑π∆∞0123456789";
        let interval = null;

        cipherEl.onmouseover = event => {  
            let iteration = 0;
            clearInterval(interval);
            interval = setInterval(() => {
                event.target.innerText = event.target.innerText
                .split("")
                .map((letter, index) => {
                    if(index < iteration) return originalText[index];
                    if(originalText[index] === " ") return " ";
                    return letters[Math.floor(Math.random() * letters.length)];
                })
                .join("");
                
                if(iteration >= originalText.length){ 
                    clearInterval(interval);
                }
                
                iteration += 1 / 4; // Controls the decryption speed
            }, 30);
        }

        // -------------------------------------
        // 2. SINE WAVE RIPPLE (Split into spans)
        // -------------------------------------
        const sineEl = document.getElementById('sine');
        originalText.split('').forEach((char, i) => {
            let span = document.createElement('span');
            span.innerText = char === ' ' ? '\u00A0' : char;
            // Introduce a rhythmic CSS animation delay based on index
            span.style.animationDelay = (i * 0.08) + 's';
            sineEl.appendChild(span);
        });

        // -------------------------------------
        // 3. MAGNETIC REPULSION (JS Distance Tracking)
        // -------------------------------------
        const magEl = document.getElementById('magnetic');
        let magSpans = [];
        originalText.split('').forEach((char, i) => {
            let span = document.createElement('span');
            span.innerText = char === ' ' ? '\u00A0' : char;
            magEl.appendChild(span);
            magSpans.push(span);
        });
        
        document.addEventListener('mousemove', e => {
            magSpans.forEach(span => {
                const rect = span.getBoundingClientRect();
                const x = rect.left + rect.width / 2;
                const y = rect.top + rect.height / 2;
                
                // Calculate hypotenuse distance to cursor
                const dist = Math.hypot(e.clientX - x, e.clientY - y);
                if(dist < 180) {
                    const angle = Math.atan2(e.clientY - y, e.clientX - x);
                    const push = (180 - dist) * 0.25;
                    span.style.transform = `translate(${-Math.cos(angle)*push}px, ${-Math.sin(angle)*push}px)`;
                    span.style.color = '#D23B72'; // Turn pink under force
                } else {
                    span.style.transform = 'translate(0,0)';
                    span.style.color = '#FFD600'; // Return to yellow
                }
            });
        });
    </script>
</body>
</html>
