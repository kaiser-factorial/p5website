    <script>
        function toggleAudio() {
            const audio = document.getElementById('spikesSong');
            const button = document.getElementById('audioButton');
            
            if (audio.paused) {
                audio.play().then(() => {
                    button.textContent = '⏸ Pause XyloZikoSpikes';
                }).catch((error) => {
                    console.error('Error playing audio:', error);
                    alert('Audio file not found. Please add XyloZikoSpikes.mp3 to your project folder.');
                });
            } else {
                audio.pause();
                button.textContent = '▶ Play XyloZikoSpikes';
            }
        }
    </script>
