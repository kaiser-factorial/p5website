<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; padding: 0; background: #fcfcfc; font-family: sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
  canvas { position: fixed; top: 0; left: 0; z-index: 100; pointer-events: none; }
  button { padding: 15px 30px; font-size: 1.2rem; cursor: pointer; z-index: 10; background: #333; color: white; border: none; border-radius: 8px;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
</head>
<body>
  <button id="btn">Trigger Option 3A: Clean Pastel Modulus</button>
  <script>
    let transitionActive = false;
    let transitionProgress = 0;
    
    let COLS = 40;
    let ROWS = 40;
    let MODULUS = 5;
    
    // Strict site palette
    let palette = ['#D23B72', '#4195DE', '#FFD600', '#fbe6ee', '#e5eff8', '#fcfcfc'];
    
    function setup() {
        createCanvas(windowWidth, windowHeight);
        noStroke();
    }
    
    function draw() {
        clear();
        if (!transitionActive) return;
        
        let cellW = width / COLS;
        let cellH = height / ROWS;
        let animatedLimit = transitionProgress * (COLS + ROWS);
        
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (r + c < animatedLimit) {
                    let linearIndex = r * COLS + c;
                    let idx = ((linearIndex % MODULUS) + MODULUS) % MODULUS;
                    let colorIdx = idx % palette.length;
                    fill(palette[colorIdx]);
                    rect(c * cellW, r * cellH, cellW + 1, cellH + 1);
                }
            }
        }
        
        if (transitionProgress < 1.0) {
           transitionProgress += 0.04;
           if (frameCount % 6 === 0) MODULUS = Math.floor(random(4, 12));
        } else if (transitionProgress < 1.5) {
           transitionProgress += 0.02;
           if (frameCount % 6 === 0) MODULUS = Math.floor(random(4, 12));
        } else {
           transitionActive = false;
        }
    }
    document.getElementById('btn').addEventListener('click', () => { transitionActive = true; transitionProgress = 0; MODULUS = 8; });
  </script>
</body>
</html>
