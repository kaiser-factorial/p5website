<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; padding: 0; background: #fcfcfc; font-family: sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
  canvas { position: fixed; top: 0; left: 0; z-index: 100; pointer-events: none; }
  button { padding: 15px 30px; font-size: 1.2rem; cursor: pointer; z-index: 10; background: #333; color: white; border: none; border-radius: 8px;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
</head>
<body>
  <button id="btn">Trigger Option 3C: Grid Checkers</button>
  <script>
    let transitionActive = false;
    let transitionProgress = 0;
    let COLS = 25;
    let ROWS = 25;
    let palette = ['#FFD600', '#D23B72', '#4195DE', '#fcfcfc'];
    
    function setup() {
        createCanvas(windowWidth, windowHeight);
        noStroke();
    }
    
    function draw() {
        clear();
        if (!transitionActive) return;
        
        let cellW = width / COLS;
        let cellH = height / ROWS;
        let animatedLimit = transitionProgress * COLS; 
        
        let modRow = Math.floor(map(sin(frameCount * 0.1), -1, 1, 2, 8));
        let modCol = Math.floor(map(cos(frameCount * 0.08), -1, 1, 2, 8));
        
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                // Expanding from the center
                let distFromCenter = dist(c, r, COLS/2, ROWS/2);
                if (distFromCenter < animatedLimit * 1.5) {
                    let rowResidue = r % modRow;
                    let colResidue = c % modCol;
                    let colorIdx = (rowResidue + colResidue) % palette.length;
                    
                    fill(palette[colorIdx]);
                    rect(c * cellW, r * cellH, cellW + 1, cellH + 1);
                }
            }
        }
        if (transitionProgress < 1.0) {
           transitionProgress += 0.04;
        } else if (transitionProgress < 1.5) {
           transitionProgress += 0.02;
        } else {
           transitionActive = false;
        }
    }
    document.getElementById('btn').addEventListener('click', () => { transitionActive = true; transitionProgress = 0; });
  </script>
</body>
</html>
