<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; padding: 0; background: #fcfcfc; font-family: sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
  .panel { position: fixed; top: 0; left: -100%; width: 100%; height: 100%; transform: skewX(-15deg); transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1); z-index: 100; pointer-events: none;}
  .p1 { background: #FFD600; transition-delay: 0s; }
  .p2 { background: #4195DE; transition-delay: 0.1s; }
  .p3 { background: #D23B72; transition-delay: 0.2s; }
  .active .panel { transform: skewX(-15deg) translateX(250%); }
  button { padding: 15px 30px; font-size: 1.2rem; cursor: pointer; z-index: 10; background: #333; color: white; border: none; border-radius: 8px;}
</style>
</head>
<body>
  <div class="panel p1"></div>
  <div class="panel p2"></div>
  <div class="panel p3"></div>
  <button onclick="document.body.classList.toggle('active'); setTimeout(() => {document.body.classList.toggle('active')}, 1500)">Trigger Option 1: CSS Sweep</button>
</body>
</html>
